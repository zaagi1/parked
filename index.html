<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Parking Slot Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Parking Slot Manager</h1>

        <input type="text" id="carNumber" placeholder="Car Number">
        <select id="slotStatus">
            <option value="">Select Status</option>
            <option value="Parked">Parked</option>
            <option value="Left">Left</option>
        </select>

        <button id="addBtn">Submit</button>

        <p id="error"></p>

        <ul id="slotList"></ul>

        <div class="summary">
            <p>Parked Cars: <span id="parkedCount">0</span></p>
            <p>Left Cars: <span id="leftCount">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
